services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml
      - SEARXNG_DEBUG=1
      - GRANIAN_ACCESS_LOG_ENABLED=true
    volumes:
      - ./searxng:/etc/searxng
  llama-cpp-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-cpp-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - LLAMA_ARG_HF_REPO=bartowski/Hermes-3-Llama-3.1-8B-GGUF
      - LLAMA_ARG_HF_FILE=Hermes-3-Llama-3.1-8B-Q4_K_M.gguf
      - LLAMA_ARG_ALIAS=hermes-3-8b
      - LLAMA_ARG_N_GPU_LAYERS=99
      - LLAMA_ARG_CTX_SIZE=8192
      - LLAMA_ARG_JINJA=true
      - LLAMA_ARG_API_KEY=default
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./data/llama-cache:/root/.cache
  api-proxy:
    build: ./proxy
    container_name: api-proxy
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - llama-cpp-server
      - searxng
    volumes:
        - ./data/custom:/custom
  